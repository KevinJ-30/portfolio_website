<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />

    <title>Kevin Jacob — Software Engineer</title>
    <meta
      name="description"
      content="Kevin Jacob — CS at Georgia Tech. Software engineering intern at Apple, ML research on graph privacy and subjective NLP."
    />
    <meta name="theme-color" content="#080809" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Kevin Jacob — Software Engineer" />
    <meta
      property="og:description"
      content="CS at Georgia Tech. SWE intern at Apple, ML research on graph privacy and subjective NLP."
    />
    <meta property="og:url" content="https://kevinj-dev.vercel.app" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Resolve the theme before first paint so there is no flash -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('kj-theme')
          document.documentElement.dataset.theme = stored === 'light' ? 'light' : 'dark'
        } catch (e) {
          document.documentElement.dataset.theme = 'dark'
        }
      })()
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Inter+Tight:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
